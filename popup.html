<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; margin: 0; padding: 12px; font: 13px "Segoe UI", sans-serif; color: #242424; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #6264a7; }
  button { width: 100%; padding: 8px; background: #6264a7; color: #fff; border: 0; border-radius: 4px; font: inherit; cursor: pointer; }
  button:disabled { background: #aaa; cursor: default; }
  #phase { margin: 10px 0 4px; font-weight: 600; }
  progress { width: 100%; height: 14px; }
  #msgs { color: #616161; margin-top: 2px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  #log { max-height: 260px; overflow: auto; background: #f5f5f5; padding: 6px; margin: 6px 0 0; font: 11px Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>📥 Chat Capture for Teams</h1>
  <button id="start">Capturar conversa desta aba</button>
  <div id="phase">Parado</div>
  <progress id="bar" max="1"></progress>
  <div id="msgs">0 mensagens</div>
  <details open>
    <summary>O que está acontecendo</summary>
    <pre id="log"></pre>
  </details>
  <script src="popup.js"></script>
</body>
</html>
